# Secrets live in AWS Secrets Manager; External Secrets Operator syncs them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-memory
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: ai-memory
  data:
    - secretKey: root-token          # root bearer: break-glass + admin CLI only
      remoteRef: { key: ai-memory/TENANT/root-token }
    - secretKey: token-pepper        # hashes developer aim_ keys; never rotate casually
      remoteRef: { key: ai-memory/TENANT/token-pepper }
    - secretKey: litellm-key         # LiteLLM virtual key for this service
      remoteRef: { key: ai-memory/TENANT/litellm-key }
