# One ai-memory instance = one trust boundary (a team, group of teams or
# data classification). ai-memory has no per-project ACL yet (upstream design
# #708), so isolation between boundaries is done with separate instances.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - statefulset.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - externalsecret.yaml
  - serviceaccount.yaml
labels:
  - pairs:
      app.kubernetes.io/name: ai-memory
      app.kubernetes.io/part-of: ai-platform
    includeSelectors: false
