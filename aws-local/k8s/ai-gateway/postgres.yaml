apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: litellm-db
spec:
  replicas: 1
  serviceName: litellm-db
  selector: { matchLabels: { app: litellm-db } }
  template:
    metadata: { labels: { app: litellm-db } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - { name: POSTGRES_DB, value: litellm }
            - { name: POSTGRES_USER, value: litellm }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: litellm, key: db-password } }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "litellm"] }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-db
spec:
  selector: { app: litellm-db }
  ports: [{ port: 5432 }]
