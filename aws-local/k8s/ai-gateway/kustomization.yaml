# Stand-in for the shared LiteLLM gateway a platform team would run.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-gateway
resources:
  - namespace.yaml
  - externalsecret.yaml
  - postgres.yaml
  - litellm.yaml
  - nodeport.yaml
configMapGenerator:
  - name: litellm-config
    files: [config.yaml]
