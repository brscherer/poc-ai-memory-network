apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: litellm }
  data:
    - { secretKey: master-key,  remoteRef: { key: ai-gateway/litellm/master-key } }
    - { secretKey: salt-key,    remoteRef: { key: ai-gateway/litellm/salt-key } }
    - { secretKey: db-password, remoteRef: { key: ai-gateway/litellm/db-password } }
    # Bedrock caller identity. Real EKS: Pod Identity on the LiteLLM service account.
    - { secretKey: aws-access-key, remoteRef: { key: ai-memory/team-a/backup-aws, property: access_key } }
    - { secretKey: aws-secret-key, remoteRef: { key: ai-memory/team-a/backup-aws, property: secret_key } }
